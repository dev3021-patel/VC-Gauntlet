services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: party
      POSTGRES_PASSWORD: party_local
      POSTGRES_DB: party_conquest
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party -d party_conquest"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
